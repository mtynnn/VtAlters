prefix: "<primary><bold>vAltars</bold></primary> <dark_gray>»</dark_gray> "

emojis:
  success: "✔"
  error: "✖"
  warning: "⚠"
  altar: "✦"

general:
  reloaded: "<prefix><success><emoji:success> Configuration and messages reloaded.</success>"
  reload-failed: "<prefix><error><emoji:error> Reload rejected; the previous configuration remains active.</error>"
  not-a-player: "<prefix><error>This command requires a player.</error>"
  no-permission: "<prefix><error>You do not have permission to use this command.</error>"
  unknown-command: "<prefix><error>Unknown subcommand. Use <white>/valtars help</white>.</error>"
  usage: "<prefix><error>Usage: <white><usage></white></error>"

wand:
  given: "<prefix><success>You received the altar setup wand.</success>"
  selection: "<prefix><primary>Selected block: <white><x>, <y>, <z></white>.</primary>"
  error-no-selection: "<prefix><error>Select a block with the wand first.</error>"

altar-commands:
  created: "<prefix><success>Altar <primary><name></primary> created.</success>"
  deleted: "<prefix><success>Altar <primary><name></primary> deleted.</success>"
  center-set: "<prefix><success>Altar center updated.</success>"
  boss-set: "<prefix><success>Altar MythicMob updated.</success>"
  center-item-set: "<prefix><success>Activation item updated.</success>"
  pedestal-added: "<prefix><success>Pedestal added.</success>"
  pedestal-removed: "<prefix><success>Pedestal(s) updated.</success>"
  required-item-set: "<prefix><success>Requirement assigned to the next pedestal.</success>"
  required-item-removed: "<prefix><success>Item requirement(s) updated.</success>"
  list-header: "<primary><bold>Registered altars</bold></primary>"
  list-entry: "<dark_gray>•</dark_gray> <white><name></white>"
  list-empty: "<muted>No altars are registered.</muted>"
  error-no-altar: "<prefix><error>Altar <white><name></white> does not exist.</error>"
  error-altar-exists: "<prefix><error>Altar <white><name></white> already exists.</error>"
  error-altar-busy: "<prefix><warning>Altar <white><name></white> has placed items or an active ritual.</warning>"
  error-conflict: "<prefix><error>The change conflicts with altar geometry or requirements.</error>"
  error-invalid: "<prefix><error>The name, item, amount, or configuration is invalid.</error>"
  error-invalid-number: "<prefix><error>The amount must be a positive integer.</error>"
  error-no-item-in-hand: "<prefix><error>Hold an item in your main hand.</error>"

altar-interaction:
  not-ready: "<prefix><warning>The altar is still missing required items.</warning>"
  wrong-item: "<prefix><error>That is not the activation item.</error>"
  not-enough-activation: "<prefix><warning>You need <amount> activation items.</warning>"
  wrong-pedestal-item: "<prefix><error><item> is not needed now.</error> <muted>Missing: <hint>.</muted>"
  pedestal-hologram: "<primary><bold><amount>x</bold></primary> <item>"
  pedestal-full: "<prefix><warning>That pedestal cannot accept any more units.</warning>"
  ritual-start: "<prefix><primary><emoji:altar> The ritual has begun...</primary>"
  boss-spawned: "<prefix><success><emoji:success> The boss was summoned.</success>"
  summoning: "<prefix><warning>A ritual is already active at this altar.</warning>"
  not-your-item: "<prefix><error>You cannot retrieve an item placed by someone else.</error>"
  world-unavailable: "<prefix><error>This altar's world is not loaded.</error>"
  refund-pending: "<prefix><warning>Not enough inventory space: the refund was saved for your next login.</warning>"
  placements-expired: "<prefix><warning>The altar reset after inactivity or abandonment; its items were returned.</warning>"
  boss-summon-broadcast: "<primary><emoji:altar> <player></primary> <muted>summoned</muted> <white><boss></white><muted>.</muted>"
  error-invalid-boss: "<prefix><error><emoji:error> Could not summon <white><boss></white>; items were returned or saved.</error>"

gui:
  title: "<primary><bold>Altars</bold></primary> <muted>· <page>/<pages></muted>"
  altar-name: "<primary><bold><name></bold></primary>"
  altar-lore:
    - "<muted>Boss:</muted> <white><boss></white>"
    - "<muted>Location:</muted> <white><world> · <coordinates></white>"
    - "<muted>Pedestals:</muted> <white><pedestals></white>"
    - "<muted>Center items:</muted> <white><activation></white>"
    - "<muted>Status:</muted> <state>"
    - ""
    - "<success>Click to teleport.</success>"
  state-busy: "<warning>Busy</warning>"
  state-available: "<success>Available</success>"
  previous: "<primary>Previous page</primary>"
  next: "<primary>Next page</primary>"
  close: "<error>Close</error>"
  teleported: "<prefix><success>Teleported to altar <white><name></white>.</success>"
  teleport-failed: "<prefix><error>Could not teleport to altar <white><name></white>.</error>"
  world-unavailable: "<prefix><error>The world or center for altar <white><name></white> is unavailable.</error>"

help:
  header: "<newline><primary><bold>vAltars</bold></primary> <muted>| Help <page>/<pages></muted><newline>"
  footer: "<newline><muted>Click a command to suggest it.</muted><newline>"
  invalid-page: "<prefix><error>Invalid page. Range: 1-<pages>.</error>"
  descriptions:
    help: "Shows the available help."
    about: "Shows plugin information."
    reload: "Reloads configuration and messages."
    create: "Creates an altar definition."
    delete: "Deletes an inactive altar."
    list: "Lists registered altars."
    gui: "Opens the altar browser and teleport menu."
    wand: "Gives the selection wand."
    set-center: "Sets the central block."
    set-mob: "Sets the MythicMob."
    itemcenter: "Sets the activation item and amount."
    add-pedestal: "Adds the selected block as a pedestal."
    add-item: "Adds a Bukkit or Nexo requirement."
    remove-pedestal: "Removes one or all pedestals."
    remove-item: "Removes one or all requirements."

about:
  lines:
    - ""
    - "<primary><bold>vAltars <version></bold></primary>"
    - "<muted>Safe MythicMobs ritual altars.</muted>"
    - "<gray>Author: <white>ValerinSMP</white></gray>"
    - "<gray>Platform: <white>Paper 1.21.11+</white></gray>"
    - "<gray>Integrations: <white>MythicMobs and optional Nexo</white></gray>"
  repository-label: "<primary>vAltars repository</primary>"
  repository-hover: "<muted>Open the GitHub repository</muted>"
  repository-url: "https://github.com/ValerinSMP/VtAlters"
