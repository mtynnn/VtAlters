prefix: "<primary><bold>vAltars</bold></primary> <dark_gray>»</dark_gray> "

emojis:
  success: "✔"
  error: "✖"
  warning: "⚠"
  altar: "✦"

general:
  reloaded: "<prefix><success><emoji:success> Configuración y mensajes recargados.</success>"
  reload-failed: "<prefix><error><emoji:error> Recarga rechazada; la configuración anterior sigue activa.</error>"
  not-a-player: "<prefix><error>Este comando requiere un jugador.</error>"
  no-permission: "<prefix><error>No tienes permiso para usar este comando.</error>"
  unknown-command: "<prefix><error>Subcomando desconocido. Usa <white>/valtars help</white>.</error>"
  usage: "<prefix><error>Uso: <white><usage></white></error>"

wand:
  given: "<prefix><success>Recibiste la varita de configuración.</success>"
  selection: "<prefix><primary>Bloque seleccionado: <white><x>, <y>, <z></white>.</primary>"
  error-no-selection: "<prefix><error>Selecciona primero un bloque con la varita.</error>"

altar-commands:
  created: "<prefix><success>Altar <primary><name></primary> creado.</success>"
  deleted: "<prefix><success>Altar <primary><name></primary> eliminado.</success>"
  center-set: "<prefix><success>Centro del altar actualizado.</success>"
  boss-set: "<prefix><success>MythicMob del altar actualizado.</success>"
  center-item-set: "<prefix><success>Objeto de activación actualizado.</success>"
  pedestal-added: "<prefix><success>Pedestal añadido.</success>"
  pedestal-removed: "<prefix><success>Pedestal(es) actualizado(s).</success>"
  required-item-set: "<prefix><success>Requisito asignado al siguiente pedestal.</success>"
  required-item-removed: "<prefix><success>Requisito(s) de objeto actualizado(s).</success>"
  list-header: "<primary><bold>Altares registrados</bold></primary>"
  list-entry: "<dark_gray>•</dark_gray> <white><name></white>"
  list-empty: "<muted>No hay altares registrados.</muted>"
  error-no-altar: "<prefix><error>No existe el altar <white><name></white>.</error>"
  error-altar-exists: "<prefix><error>Ya existe el altar <white><name></white>.</error>"
  error-altar-busy: "<prefix><warning>El altar <white><name></white> tiene objetos o un ritual activo.</warning>"
  error-conflict: "<prefix><error>El cambio entra en conflicto con la geometría o requisitos del altar.</error>"
  error-invalid: "<prefix><error>El nombre, objeto, cantidad o configuración no es válido.</error>"
  error-invalid-number: "<prefix><error>La cantidad debe ser un entero positivo.</error>"
  error-no-item-in-hand: "<prefix><error>Debes sostener un objeto en la mano principal.</error>"

altar-interaction:
  not-ready: "<prefix><warning>El altar aún no tiene todos sus objetos.</warning>"
  wrong-item: "<prefix><error>Ese no es el objeto de activación.</error>"
  not-enough-activation: "<prefix><warning>Necesitas <amount> unidades del objeto de activación.</warning>"
  wrong-pedestal-item: "<prefix><error><item> no es necesario ahora.</error> <muted>Falta: <hint>.</muted>"
  pedestal-hologram: "<primary><bold><amount>x</bold></primary> <item>"
  pedestal-full: "<prefix><warning>Ese pedestal no puede aceptar más unidades.</warning>"
  ritual-start: "<prefix><primary><emoji:altar> El ritual ha comenzado...</primary>"
  boss-spawned: "<prefix><success><emoji:success> El jefe fue invocado.</success>"
  summoning: "<prefix><warning>Ya existe un ritual activo en este altar.</warning>"
  not-your-item: "<prefix><error>No puedes retirar un objeto colocado por otra persona.</error>"
  world-unavailable: "<prefix><error>El mundo de este altar no está cargado.</error>"
  refund-pending: "<prefix><warning>Sin espacio suficiente: la devolución quedó guardada para tu próximo ingreso.</warning>"
  placements-expired: "<prefix><warning>El altar se reinició por inactividad o abandono; sus objetos fueron devueltos.</warning>"
  boss-summon-broadcast: "<primary><emoji:altar> <player></primary> <muted>invocó a</muted> <white><boss></white><muted>.</muted>"
  error-invalid-boss: "<prefix><error><emoji:error> No se pudo invocar <white><boss></white>; los objetos fueron devueltos o quedaron guardados.</error>"

gui:
  title: "<primary><bold>Altares</bold></primary> <muted>· <page>/<pages></muted>"
  altar-name: "<primary><bold><name></bold></primary>"
  altar-lore:
    - "<muted>Jefe:</muted> <white><boss></white>"
    - "<muted>Ubicación:</muted> <white><world> · <coordinates></white>"
    - "<muted>Pedestales:</muted> <white><pedestals></white>"
    - "<muted>Objetos centrales:</muted> <white><activation></white>"
    - "<muted>Estado:</muted> <state>"
    - ""
    - "<success>Clic para teletransportarte.</success>"
  state-busy: "<warning>Ocupado</warning>"
  state-available: "<success>Disponible</success>"
  previous: "<primary>Página anterior</primary>"
  next: "<primary>Página siguiente</primary>"
  close: "<error>Cerrar</error>"
  teleported: "<prefix><success>Teletransportado al altar <white><name></white>.</success>"
  teleport-failed: "<prefix><error>No se pudo teletransportar al altar <white><name></white>.</error>"
  world-unavailable: "<prefix><error>El mundo o centro del altar <white><name></white> no está disponible.</error>"

help:
  header: "<newline><primary><bold>vAltars</bold></primary> <muted>| Ayuda <page>/<pages></muted><newline>"
  footer: "<newline><muted>Haz clic en un comando para sugerirlo.</muted><newline>"
  invalid-page: "<prefix><error>Página inválida. Rango: 1-<pages>.</error>"
  descriptions:
    help: "Muestra la ayuda disponible."
    about: "Muestra información del plugin."
    reload: "Recarga configuración y mensajes."
    create: "Crea una definición de altar."
    delete: "Elimina un altar inactivo."
    list: "Lista los altares registrados."
    gui: "Abre el navegador de altares y teletransporte."
    wand: "Entrega la varita de selección."
    set-center: "Establece el bloque central."
    set-mob: "Establece el MythicMob."
    itemcenter: "Establece el objeto y la cantidad de activación."
    add-pedestal: "Añade el bloque seleccionado como pedestal."
    add-item: "Añade un requisito Bukkit o Nexo."
    remove-pedestal: "Retira uno o todos los pedestales."
    remove-item: "Retira uno o todos los requisitos."

about:
  lines:
    - ""
    - "<primary><bold>vAltars <version></bold></primary>"
    - "<muted>Altares rituales seguros para MythicMobs.</muted>"
    - "<gray>Autor: <white>ValerinSMP</white></gray>"
    - "<gray>Plataforma: <white>Paper 1.21.11+</white></gray>"
    - "<gray>Integraciones: <white>MythicMobs y Nexo opcional</white></gray>"
  repository-label: "<primary>Repositorio de vAltars</primary>"
  repository-hover: "<muted>Abrir el repositorio en GitHub</muted>"
  repository-url: "https://github.com/ValerinSMP/vAltars"
