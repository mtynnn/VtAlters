name: vAltars
version: '${version}'
main: com.valerinsmp.valtars.VAltarsPlugin
api-version: '1.21.11'
author: ValerinSMP
contributors: [thangks]
description: Altares rituales seguros para invocar MythicMobs, con soporte opcional de Nexo.
website: https://github.com/ValerinSMP/vAltars
depend: [MythicMobs]
softdepend: [Nexo]

commands:
  valtars:
    description: Ayuda e información pública de vAltars.
    usage: /<command> <help|about>
  valtarsadmin:
    description: Administración de altares rituales.
    usage: /<command> <help|about|reload|create|delete|list|gui|wand|edit>
    aliases: [altar, vta, vtalters]

permissions:
  valtars.admin:
    description: Concede todos los permisos administrativos de vAltars.
    default: op
    children:
      valtars.command.create: true
      valtars.command.delete: true
      valtars.command.list: true
      valtars.command.teleport: true
      valtars.command.wand: true
      valtars.command.reload: true
      valtars.command.edit: true
  valtars.command.create:
    default: op
  valtars.command.delete:
    default: op
  valtars.command.list:
    default: op
  valtars.command.teleport:
    default: op
  valtars.command.wand:
    default: op
  valtars.command.reload:
    default: op
  valtars.command.edit:
    default: op

  # Compatibilidad con asignaciones existentes. El código acepta ambos namespaces.
  vtalters.admin:
    default: false
  vtalters.command.create:
    default: false
  vtalters.command.delete:
    default: false
  vtalters.command.list:
    default: false
  vtalters.command.teleport:
    default: false
  vtalters.command.wand:
    default: false
  vtalters.command.reload:
    default: false
  vtalters.command.edit:
    default: false
